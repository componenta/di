name: Sixth pass parity verification

on:
  push:
    branches:
      - verify-dev-recheck-6

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pest tests/Architecture/CompiledPrivateLazyConstructorParityTest.php --colors=always
      - run: composer phpstan
      - run: composer cs-check
