name: Finalize Componenta DI dev

on:
  push:
    branches: [dev]
    paths:
      - .automation/finalize-dev-trigger

permissions:
  contents: write

concurrency:
  group: componenta-di-dev-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        env:
          COMPOSER_ALLOW_SUPERUSER: '1'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply verified fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}: {old!r}')
              p.write_text(text.replace(old, new, count))

          replace(
              'src/Compile/Factory/FactoryCodeGenerator.php',
              '    private function reset(ReflectionClass $class): void\n',
              '    /** @param ReflectionClass<object> $class */\n'
              '    private function reset(ReflectionClass $class): void\n',
          )

          replace(
              'src/ContainerBuilder.php',
              '        $builder = static::newBuilder();\n',
              '        $builder = self::newBuilder();\n',
          )

          replace(
              'src/LazyObjectFactoryInterface.php',
              '     * @param callable(T $instance): mixed $initializer\n',
              '     * @param callable(T $instance): void $initializer\n',
          )
          replace(
              'src/ProxyFactory.php',
              '     * @param callable(T): mixed $initializer\n',
              '     * @param callable(T): void $initializer\n',
          )

          replace(
              'src/Resolver/ConfigValueExtractor.php',
              '            if (!$this->hasKey($entry, $key)) {\n',
              '            /** @var array<string, mixed>|ArrayAccess<string, mixed> $entry */\n'
              '            if (!$this->hasKey($entry, $key)) {\n',
          )

          replace(
              'src/Resolver/MakeAttributeResolver.php',
              '     *     entry: string,\n',
              '     *     entry: non-empty-string,\n',
              2,
          )
          replace(
              'src/Resolver/MakeAttributeResolver.php',
              '        $entry = $make->entry ?? $typeName ?? $name;\n\n'
              '        return [\n',
              '        $entry = $make->entry ?? $typeName ?? $name;\n\n'
              "        if ($entry === '') {\n"
              "            throw new LogicException('Make entry must be a non-empty string.');\n"
              '        }\n\n'
              '        return [\n',
          )
          replace(
              'src/Resolver/MakeAttributeResolver.php',
              '     * @param class-string<T> $proxyClass\n'
              '     * @param array<string, mixed> $params\n',
              '     * @param class-string<T> $proxyClass\n'
              '     * @param non-empty-string $entry\n'
              '     * @param array<string, mixed> $params\n',
          )
          replace(
              'src/Resolver/MakeAttributeResolver.php',
              '     * @param class-string|null $typeName\n'
              '     * @return class-string<object>\n'
              '     */\n'
              '    private static function resolveProxyClass(\n'
              '        string $entry,\n',
              '     * @param non-empty-string $entry\n'
              '     * @param class-string|null $typeName\n'
              '     * @return class-string<object>\n'
              '     */\n'
              '    private static function resolveProxyClass(\n'
              '        string $entry,\n',
          )

          p = Path('tests/Resolver/InvokableResolverTest.php')
          text = p.read_text()
          text = text.replace('use Componenta\\DI\\Exception\\ResolutionException;\n', '', 1)
          old = (
              "        it('rejects a concrete proxy override on a class-level Proxy attribute', function () {\n"
              '            $resolver = new InvokableResolver(\n'
              '                [InvalidInvokableClassProxy::class],\n'
              '                new ProxyFactory(),\n'
              '            );\n\n'
              '            expect(fn () => $resolver->resolve(InvalidInvokableClassProxy::class))\n'
              '                ->toThrow(\n'
              '                    ResolutionException::class,\n'
              "                    'Class-level #[Proxy] must not specify a proxy class',\n"
              '                );\n'
              '        });\n'
          )
          new = (
              "        it('rejects a concrete proxy override on a class-level Proxy attribute before resolution', function () {\n"
              '            expect(fn () => new InvokableResolver(\n'
              '                [InvalidInvokableClassProxy::class],\n'
              '                new ProxyFactory(),\n'
              '            ))->toThrow(\n'
              '                InvalidConfigurationException::class,\n'
              "                'Class-level #[Proxy] must not specify a proxy class',\n"
              '            );\n'
              '        });\n'
          )
          if old not in text:
              raise SystemExit('InvokableResolverTest.php: expected obsolete proxy test block not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('tests/ConfigProviderTest.php')
          text = p.read_text()
          anchor = '    $dependencies = $config[ConfigKey::DEPENDENCIES];\n'
          if anchor not in text:
              raise SystemExit('ConfigProviderTest.php: dependencies anchor not found')
          text = text.replace(
              anchor,
              anchor + '    $diDependencyKeys = \\Componenta\\DI\\ConfigKey::dependencyKeys();\n',
              1,
          )
          old = (
              '        ->and(\\Componenta\\DI\\ConfigKey::dependencyKeys())\n'
              '        ->toBe(ConfigKey::dependencyKeys());\n'
          )
          new = (
              '        ->and(array_diff($diDependencyKeys, ConfigKey::dependencyKeys()))\n'
              '        ->toBe([])\n'
              '        ->and($diDependencyKeys)\n'
              "        ->not->toContain('generated_entry_resolver_file')\n"
              '        ->and($diDependencyKeys)\n'
              "        ->not->toContain('generated_entry_resolver_release_fingerprint');\n"
          )
          if old not in text:
              raise SystemExit('ConfigProviderTest.php: obsolete dependency-key assertion not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Apply project code style
        run: composer cs-fix

      - name: Validate package
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: PHP syntax check
        shell: bash
        run: |
          find src tests verification benchmarks -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Run PHPStan
        run: composer phpstan

      - name: Run tests
        run: composer test

      - name: Confirm style is clean after tests
        run: composer cs-check

      - name: Commit verified result and remove temporary automation
        shell: bash
        run: |
          rm -rf .automation
          rm -f \
            .github/workflows/recheck-dev.yml \
            .github/workflows/apply-recheck-patches.yml \
            .github/workflows/finalize-dev.yml
          rm -f composer.lock .php-cs-fixer.cache

          git config user.name "Andrey Shelamkoff"
          git config user.email "inbox.shelamkoff@gmail.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No verified changes to commit."
            exit 0
          fi

          git commit -m "Finalize DI verification fixes"
          git push origin HEAD:dev
