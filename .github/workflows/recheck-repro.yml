name: Recheck verification

on:
  push:
    branches: [verify-dev-recheck]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm source tree matches fix commit
        shell: bash
        run: |
          git diff --exit-code 6bb18b70624aa7ecefaac39fe6ffc5cc7894d224 -- . ':(exclude).github/workflows/recheck-repro.yml'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        env:
          COMPOSER_ALLOW_SUPERUSER: '1'
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run focused regressions
        run: vendor/bin/pest tests/DefinitionReplacementTest.php tests/CallableResolverTest.php
