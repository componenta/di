name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: startsWith(github.event.head_commit.message, 'Release v')
    name: Verify PHP ${{ matrix.php }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            os: ubuntu-latest
          - php: '8.5'
            os: ubuntu-latest
          - php: '8.4'
            os: windows-latest
          - php: '8.5'
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: fileinfo, mbstring, pdo_sqlite
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.php == '8.4'
        run: composer audit --no-interaction

      - name: Run checks
        run: composer check

  consumer-lowest:
    if: startsWith(github.event.head_commit.message, 'Release v')
    name: Lowest production dependencies PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install and smoke test a production consumer
        shell: bash
        run: |
          consumer_workspace="$(mktemp -d "$RUNNER_TEMP/di-consumer.XXXXXX")"
          trap 'rm -rf "$consumer_workspace"' EXIT
          mkdir "$consumer_workspace/package" "$consumer_workspace/consumer"
          git archive HEAD | tar -x -C "$consumer_workspace/package"
          cat > "$consumer_workspace/consumer/composer.json" <<'JSON'
          {
            "require": {"componenta/di": "*@dev"},
            "repositories": [
              {"type": "path", "url": "../package", "options": {"symlink": false}}
            ],
            "minimum-stability": "stable",
            "prefer-stable": true
          }
          JSON
          composer update --working-dir="$consumer_workspace/consumer" \
            --prefer-lowest --prefer-stable --no-dev --no-interaction --no-progress --prefer-dist
          cmp "$consumer_workspace/package/composer.json" "$consumer_workspace/consumer/vendor/componenta/di/composer.json"
          diff -r "$consumer_workspace/package/src" "$consumer_workspace/consumer/vendor/componenta/di/src"
          php tests/consumer-smoke.php "$consumer_workspace/consumer/vendor/autoload.php"

  coverage:
    if: startsWith(github.event.head_commit.message, 'Release v')
    name: Coverage PHP 8.4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: pcov
          extensions: fileinfo, mbstring, pdo_sqlite
          ini-values: memory_limit=2G
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Enforce coverage and generate Clover report
        run: composer test-coverage -- --coverage-clover coverage.xml

      - name: Check mutation score
        run: composer test-mutation -- --parallel

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-coverage-php-8.4
          path: coverage.xml
          if-no-files-found: error

  publish:
    if: startsWith(github.event.head_commit.message, 'Release v')
    needs:
      - verify
      - consumer-lowest
      - coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          first_line="${COMMIT_MESSAGE%%$'\n'*}"
          tag="${first_line#Release }"

          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          remote_tag="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          tag_target=''
          tag_peeled_target=''
          while IFS=$'\t' read -r target reference; do
            if [[ "$reference" == "refs/tags/$tag" ]]; then
              tag_target="$target"
            elif [[ "$reference" == "refs/tags/$tag^{}" ]]; then
              tag_peeled_target="$target"
            fi
          done <<< "$remote_tag"
          tag_target="${tag_peeled_target:-$tag_target}"
          if [[ -n "$tag_target" && "$tag_target" != "$GITHUB_SHA" ]]; then
            echo "Release tag $tag points to $tag_target, expected tested commit $GITHUB_SHA." >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi

          release_flags=()
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$tag" \
            "${release_flags[@]}" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes
