name: Recheck Componenta DI dev

on:
  push:
    branches: [dev]
    paths:
      - .automation/recheck-dev-trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: componenta-di-dev-recheck
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Run complete verification
        shell: bash
        env:
          COMPOSER_ALLOW_SUPERUSER: '1'
        run: |
          set +e

          composer install --no-interaction --prefer-dist --no-progress
          install_status=$?

          if [ "$install_status" -eq 0 ]; then
            composer validate --strict
            validate_status=$?

            composer audit --no-interaction
            audit_status=$?

            composer cs-check
            cs_status=$?

            find src tests verification benchmarks -name '*.php' -print0 \
              | xargs -0 -n1 php -l
            lint_status=$?

            composer phpstan
            phpstan_status=$?

            composer test
            test_status=$?
          else
            validate_status=125
            audit_status=125
            cs_status=125
            lint_status=125
            phpstan_status=125
            test_status=125
          fi

          printf '\nVerification status codes:\n'
          printf 'composer install: %s\n' "$install_status"
          printf 'composer validate: %s\n' "$validate_status"
          printf 'composer audit: %s\n' "$audit_status"
          printf 'composer cs-check: %s\n' "$cs_status"
          printf 'PHP lint: %s\n' "$lint_status"
          printf 'composer phpstan: %s\n' "$phpstan_status"
          printf 'composer test: %s\n' "$test_status"

          overall=0
          for status in \
            "$install_status" \
            "$validate_status" \
            "$audit_status" \
            "$cs_status" \
            "$lint_status" \
            "$phpstan_status" \
            "$test_status"
          do
            if [ "$status" -ne 0 ]; then
              overall=1
            fi
          done

          exit "$overall"
