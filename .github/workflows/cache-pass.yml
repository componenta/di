name: Cache boundary regression pass

on:
  push:
    branches: [verify-dev-recheck-4-cache-pass]

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        env:
          COMPOSER_ALLOW_SUPERUSER: '1'
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run focused regressions
        run: >-
          vendor/bin/pest
          tests/CompiledFactoryShardWriterTest.php
          tests/CallableExecutorTest.php
          tests/Resolver/Parameter/Request/RequestMapperSortValidationTest.php
          tests/Resolver/Parameter/Request/RequestAttributeAmbiguityTest.php
          tests/TrustedCacheValidationTest.php
