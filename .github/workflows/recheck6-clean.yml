name: Sixth pass clean-tree verification

on:
  push:
    branches:
      - verify-dev-recheck-6-clean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm exact source tree
        run: git diff --exit-code 88b61f1a170ec89acad1c4b8d9e707e1227194f7 -- . ':(exclude).github/workflows/recheck6-clean.yml'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: composer audit --no-interaction
      - name: PHP syntax check
        run: find src tests verification benchmarks -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer phpstan
      - run: composer test
      - run: composer cs-check
