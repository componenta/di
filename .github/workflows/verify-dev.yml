name: Verify dev audit fixes

on:
  push:
    branches:
      - dev
    paths:
      - '.automation/verify-dev'

permissions:
  contents: write

concurrency:
  group: verify-dev-audit-fixes
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Run repository verification
        id: checks
        shell: bash
        env:
          COMPOSER_ALLOW_SUPERUSER: '1'
        run: |
          set +e
          mkdir -p /tmp/componenta-di-verification

          composer config --no-plugins allow-plugins.pestphp/pest-plugin true
          composer install --no-interaction --prefer-dist --no-progress \
            > /tmp/componenta-di-verification/composer-install.log 2>&1
          install_status=$?

          if [[ $install_status -eq 0 ]]; then
            composer validate --strict \
              > /tmp/componenta-di-verification/composer-validate.log 2>&1
            validate_status=$?

            find src tests verification benchmarks -name '*.php' -print0 \
              | xargs -0 -n1 php -l \
              > /tmp/componenta-di-verification/php-lint.log 2>&1
            lint_status=$?

            mapfile -t changed_src < <(
              git diff --name-only main...HEAD -- src \
                | grep -E '\.php$' \
                | sort -u
            )

            if [[ ${#changed_src[@]} -eq 0 ]]; then
              echo 'No changed source files.' \
                > /tmp/componenta-di-verification/phpstan-changed.log
              phpstan_changed_status=0
            else
              vendor/bin/phpstan analyse --level=max "${changed_src[@]}" \
                > /tmp/componenta-di-verification/phpstan-changed.log 2>&1
              phpstan_changed_status=$?
            fi

            composer phpstan \
              > /tmp/componenta-di-verification/phpstan-full.log 2>&1
            phpstan_full_status=$?

            composer test \
              > /tmp/componenta-di-verification/tests.log 2>&1
            test_status=$?
          else
            validate_status=125
            lint_status=125
            phpstan_changed_status=125
            phpstan_full_status=125
            test_status=125
          fi

          overall=0
          for status in \
            $install_status \
            $validate_status \
            $lint_status \
            $phpstan_changed_status \
            $test_status
          do
            if [[ $status -ne 0 ]]; then
              overall=1
            fi
          done

          {
            echo '# Dev verification result'
            echo
            echo "Commit checked: $(git rev-parse HEAD)"
            echo
            echo '| Check | Exit code | Gating |'
            echo '|---|---:|---|'
            echo "| composer install | $install_status | yes |"
            echo "| composer validate --strict | $validate_status | yes |"
            echo "| PHP lint | $lint_status | yes |"
            echo "| PHPStan: changed source files | $phpstan_changed_status | yes |"
            echo "| PHPStan: complete src baseline | $phpstan_full_status | no |"
            echo "| Pest | $test_status | yes |"
            echo
            for name in \
              composer-install \
              composer-validate \
              php-lint \
              phpstan-changed \
              phpstan-full \
              tests
            do
              echo "## $name"
              echo
              echo '```text'
              tail -n 400 "/tmp/componenta-di-verification/${name}.log" 2>/dev/null || true
              echo '```'
              echo
            done
          } > .automation/verification-result.md

          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit verification report
        shell: bash
        run: |
          rm -f .automation/verify-dev
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation/verification-result.md .automation/verify-dev
          git commit -m "Record dev verification result"
          git push origin HEAD:dev

      - name: Fail workflow when gating checks failed
        if: steps.checks.outputs.overall != '0'
        shell: bash
        run: exit 1
