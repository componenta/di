name: Fifth pass patch script

on:
  push:
    branches:
      - verify-dev-recheck-5

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/recheck5_patch.py
      - run: |
          git config user.name 'Andrey Shelamkoff'
          git config user.email 'inbox.shelamkoff@gmail.com'
          git add -A
          git commit -m 'Fix cache envelope and drive-relative shard paths'
          git push origin HEAD:verify-dev-recheck-5
