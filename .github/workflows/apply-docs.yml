name: Apply 3.x documentation updates

on:
  push:
    branches:
      - dev
    paths:
      - '.automation/docs-patch'

permissions:
  contents: write

concurrency:
  group: apply-docs-dev
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Update English and Russian documentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              Path('README.md'): [
                  (
                      "| `#[Proxy]` | Class or injection point: use a virtual proxy. |",
                      "| `#[Proxy(?ConcreteClass::class)]` | Class or injection point: use a virtual proxy; interface-typed or service-id injection points require a concrete proxy class. |",
                  ),
                  (
                      "Request mappers are `#[MapQueryString]`, `#[MapRequestPayload]`, `#[MapHeaders]`, `#[MapCookies]`, `#[MapRequestAttributes]`, `#[MapServerParams]`, and `#[MapUploadedFiles]`. They can transform an array or create a class-typed DTO through `FactoryInterface::make()`.",
                      "Request mappers are `#[MapQueryString]`, `#[MapRequestPayload]`, `#[MapHeaders]`, `#[MapCookies]`, `#[MapRequestAttributes]`, `#[MapServerParams]`, and `#[MapUploadedFiles]`. They can transform an array or create a class-typed DTO through `FactoryInterface::make()`.\n\nWhen a validator exists for the DTO class, mapping validates the extracted raw request data before `transform()`. This order is intentional: aliases, casts, defaults, sort mapping, and exclusions must not hide malformed transport input.\n\nMappers may combine their primary source with selected request attributes and uploaded files. Different values for the same key are rejected by default with `RequestDataConflictException`; identical duplicates are accepted. Pass `conflictPolicy: RequestDataConflictPolicy::FirstWins` or `RequestDataConflictPolicy::LastWins` explicitly only when source precedence is part of the endpoint contract.",
                  ),
                  (
                      "Factory-bound services are eager unless their factory implements `LazyServiceFactoryInterface`. Class-level `#[Lazy]` and `#[Proxy]` apply to reflection/invokable construction, not arbitrary objects returned by factories.",
                      "Factory-bound services are eager unless their factory implements `LazyServiceFactoryInterface`. Class-level `#[Lazy]` and `#[Proxy]` apply to reflection/invokable construction, not arbitrary objects returned by factories. For an interface-typed or service-id injection point, use `#[Proxy(ConcreteClass::class)]` so PHP's native proxy API has a concrete class to instantiate.",
                  ),
                  (
                      "entries: [new AutowireEntry(CreateOrder::class, 'application command')],",
                      "entries: [new AutowireEntry(CreateOrder::class)],",
                  ),
                  (
                      "| `DelegatorException` | A delegator failed. |",
                      "| `DelegatorException` | A delegator failed. |\n| `RequestDataConflictException` | Request mapping received different values for one key from multiple sources. |",
                  ),
              ],
              Path('README.ru.md'): [
                  (
                      "| `#[Proxy]` | Класс или точка внедрения: использовать виртуальный прокси. |",
                      "| `#[Proxy(?ConcreteClass::class)]` | Класс или точка внедрения: использовать виртуальный прокси; для интерфейса или произвольного ID сервиса требуется конкретный класс прокси. |",
                  ),
                  (
                      "Атрибуты отображения запроса: `#[MapQueryString]`, `#[MapRequestPayload]`, `#[MapHeaders]`, `#[MapCookies]`, `#[MapRequestAttributes]`, `#[MapServerParams]` и `#[MapUploadedFiles]`. Они возвращают преобразованный массив либо создают DTO через `FactoryInterface::make()`.",
                      "Атрибуты отображения запроса: `#[MapQueryString]`, `#[MapRequestPayload]`, `#[MapHeaders]`, `#[MapCookies]`, `#[MapRequestAttributes]`, `#[MapServerParams]` и `#[MapUploadedFiles]`. Они возвращают преобразованный массив либо создают DTO через `FactoryInterface::make()`.\n\nЕсли для класса DTO существует валидатор, сначала проверяются извлечённые сырые данные запроса и только затем выполняется `transform()`. Такой порядок намеренный: переименование, преобразование типов, значения по умолчанию, отображение сортировки и исключение полей не должны скрывать некорректный транспортный ввод.\n\nMapper может объединять основной источник с выбранными атрибутами запроса и загруженными файлами. Разные значения одного ключа по умолчанию приводят к `RequestDataConflictException`; одинаковые дубликаты допустимы. Политику `RequestDataConflictPolicy::FirstWins` или `RequestDataConflictPolicy::LastWins` следует задавать явно только тогда, когда приоритет источников является частью контракта endpoint.",
                  ),
                  (
                      "Сервисы обычных фабрик создаются сразу, если фабрика не реализует `LazyServiceFactoryInterface`. Атрибуты класса `#[Lazy]` и `#[Proxy]` действуют на сборку через рефлексию или invokable-резолвер, но не на произвольные объекты, возвращенные фабрикой.",
                      "Сервисы обычных фабрик создаются сразу, если фабрика не реализует `LazyServiceFactoryInterface`. Атрибуты класса `#[Lazy]` и `#[Proxy]` действуют на сборку через рефлексию или invokable-резолвер, но не на произвольные объекты, возвращенные фабрикой. Для точки внедрения с типом-интерфейсом или произвольным ID сервиса используйте `#[Proxy(ConcreteClass::class)]`, чтобы нативный API PHP получил конкретный класс прокси.",
                  ),
                  (
                      "entries: [new AutowireEntry(CreateOrder::class, 'application command')],",
                      "entries: [new AutowireEntry(CreateOrder::class)],",
                  ),
                  (
                      "| `DelegatorException` | Делегатор завершился с ошибкой. |",
                      "| `DelegatorException` | Делегатор завершился с ошибкой. |\n| `RequestDataConflictException` | Несколько источников request mapping передали разные значения одного ключа. |",
                  ),
              ],
          }

          for path, items in replacements.items():
              text = path.read_text()
              for old, new in items:
                  if old not in text:
                      raise SystemExit(f'Expected documentation fragment not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Commit documentation
        shell: bash
        run: |
          rm -f .automation/docs-patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.ru.md .automation/docs-patch
          git commit -m "Document request conflicts and 3.x proxy semantics"
          git push origin HEAD:dev
