name: Apply recheck source patches

on:
  push:
    branches:
      - dev
    paths:
      - '.automation/apply-recheck-patches'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Apply ContainerBuilder patches
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/ContainerBuilder.php')
          text = path.read_text()

          old = 'use Componenta\\Reflection\\Reflection;\n'
          if old not in text:
              raise SystemExit('Reflection import anchor not found')
          text = text.replace(old, '', 1)

          old = '        $container = Reflection::class(Container::class)->newLazyGhost(\n'
          new = '        $container = (new ReflectionClass(Container::class))->newLazyGhost(\n'
          if old not in text:
              raise SystemExit('Container lazy reflection anchor not found')
          text = text.replace(old, new, 1)

          old = '''        foreach ([...$invocations['before'], ...$invocations['after']] as $invocation) {
            if (!$invocation->target instanceof ReflectionClass
                || !in_array($invocation->attributeClass, [Lazy::class, Proxy::class], true)
            ) {
                return false;
            }
        }

        return true;
'''
          new = '''        foreach ([...$invocations['before'], ...$invocations['after']] as $invocation) {
            if (!$invocation->target instanceof ReflectionClass
                || !in_array($invocation->attributeClass, [Lazy::class, Proxy::class], true)
            ) {
                return false;
            }

            if ($invocation->attributeClass === Proxy::class) {
                $proxy = $invocation->newAttribute();

                if (!$proxy instanceof Proxy || $proxy->class !== null) {
                    return false;
                }
            }
        }

        return true;
'''
          if old not in text:
              raise SystemExit('Invokable attribute anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY

          php -l src/ContainerBuilder.php

      - name: Commit patches
        shell: bash
        run: |
          rm -f .automation/apply-recheck-patches
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ContainerBuilder.php .automation/apply-recheck-patches
          git commit -m "Validate proxy compilation paths"
          git push origin HEAD:dev
