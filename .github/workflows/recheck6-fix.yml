name: Sixth pass apply parity fix

on:
  push:
    branches:
      - verify-dev-recheck-6

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Apply self-checking patch
        run: python3 .automation/recheck6_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Compile/Factory/FactoryCodeGenerator.php
          git diff --cached --exit-code && exit 0
          git commit -m "Preserve non-public lazy constructor parity"
          git push
