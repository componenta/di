name: Apply ContainerBuilder patch

on:
  push:
    branches:
      - dev
    paths:
      - '.automation/container-builder/**'

permissions:
  contents: write

concurrency:
  group: apply-container-builder-dev
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Check payload completeness
        id: payload
        shell: bash
        run: |
          for part in $(seq -w 0 10); do
            if [[ ! -f ".automation/container-builder/${part}" ]]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up PHP 8.4
        if: steps.payload.outputs.ready == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Rebuild and lint ContainerBuilder
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          : > /tmp/container-builder.b64
          for part in $(seq -w 0 10); do
            cat ".automation/container-builder/${part}" >> /tmp/container-builder.b64
          done

          base64 --decode /tmp/container-builder.b64 > src/ContainerBuilder.php
          php -l src/ContainerBuilder.php

      - name: Commit rebuilt source
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          rm -rf .automation/container-builder
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ContainerBuilder.php .automation/container-builder
          git commit -m "Validate invokable aliases and factory configuration"
          git push origin HEAD:dev
