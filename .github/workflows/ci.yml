name: CI

on:
  push:
    branches:
      - v5
      - main
      - 'refactor/di6-*'
  pull_request:
    branches:
      - v5
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: di-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  USE_CONFIG_V3_WORKSPACE: ${{ github.ref == 'refs/heads/v5' || github.base_ref == 'v5' || github.ref == 'refs/heads/main' || github.base_ref == 'main' }}

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout config v3 workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: componenta/config
          ref: main
          path: .ci/config

      - name: Checkout validation workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: componenta/validation
          ref: main
          path: .ci/validation

      - name: Checkout reflection v2 workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: componenta/reflection
          ref: main
          path: .ci/reflection

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Use config v3 workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        run: >-
          composer config repositories.componenta-config
          '{"type":"path","url":".ci/config","options":{"symlink":false,"versions":{"componenta/config":"3.0.0"}}}'

      - name: Use validation workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        run: >-
          composer config repositories.componenta-validation
          '{"type":"path","url":".ci/validation","options":{"symlink":false,"versions":{"componenta/validation":"3.0.1"}}}'

      - name: Use reflection v2 workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        run: >-
          composer config repositories.componenta-reflection
          '{"type":"path","url":".ci/reflection","options":{"symlink":false,"versions":{"componenta/reflection":"2.0.1"}}}'

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit dependencies
        if: matrix.php == '8.5'
        run: composer audit --no-interaction

      - name: Run checks
        run: composer check

      - name: Smoke DI 6 benchmark suite
        run: composer bench-smoke

  native-trait-callables:
    name: Native trait callables PHP 8.5.13
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build and check minimum verified native runtime
        shell: bash
        run: bash .github/scripts/check-native-trait-callables.sh

  consumer-lowest:
    name: Lowest production dependencies PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.5'
          - '8.6'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install and smoke test a production consumer
        shell: bash
        run: |
          consumer_workspace="$(mktemp -d "$RUNNER_TEMP/di-consumer.XXXXXX")"
          trap 'rm -rf "$consumer_workspace"' EXIT
          mkdir "$consumer_workspace/package" "$consumer_workspace/consumer"
          git archive HEAD | tar -x -C "$consumer_workspace/package"
          cat > "$consumer_workspace/consumer/composer.json" <<'JSON'
          {
            "require": {"componenta/di": "*@dev"},
            "repositories": [
              {"type": "path", "url": "../package", "options": {"symlink": false}}
            ],
            "minimum-stability": "stable",
            "prefer-stable": true
          }
          JSON
          composer update --working-dir="$consumer_workspace/consumer" \
            --prefer-lowest --prefer-stable --no-dev --no-interaction --no-progress --prefer-dist
          cmp "$consumer_workspace/package/composer.json" "$consumer_workspace/consumer/vendor/componenta/di/composer.json"
          diff -r "$consumer_workspace/package/src" "$consumer_workspace/consumer/vendor/componenta/di/src"
          php tests/consumer-smoke.php "$consumer_workspace/consumer/vendor/autoload.php"

  windows:
    name: Windows PHP ${{ matrix.php }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout config v3 workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: componenta/config
          ref: main
          path: .ci/config

      - name: Checkout validation workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: componenta/validation
          ref: main
          path: .ci/validation

      - name: Checkout reflection v2 workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: componenta/reflection
          ref: main
          path: .ci/reflection

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2
        env:
          update: 'true'

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Use companion workspaces
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        shell: pwsh
        run: |
          $manifestPath = Join-Path $PWD 'composer.json'
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json -AsHashtable
          if (!$manifest.Contains('repositories')) { $manifest['repositories'] = [ordered]@{} }
          $versions = [ordered]@{ config = '3.0.0'; validation = '3.0.1'; reflection = '2.0.1' }
          foreach ($package in $versions.Keys) {
            $manifest['repositories']["componenta-$package"] = @{
              type = 'path'
              url = ".ci/$package"
              options = @{
                symlink = $false
                versions = @{ "componenta/$package" = $versions[$package] }
              }
            }
          }
          [IO.File]::WriteAllText($manifestPath, ($manifest | ConvertTo-Json -Depth 20), [Text.UTF8Encoding]::new($false))

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run checks
        run: composer check

  coverage:
    name: Coverage PHP 8.5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout config v3 workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: componenta/config
          ref: main
          path: .ci/config

      - name: Checkout validation workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: componenta/validation
          ref: main
          path: .ci/validation

      - name: Checkout reflection v2 workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: componenta/reflection
          ref: main
          path: .ci/reflection

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: pcov
          extensions: pdo_sqlite
          ini-values: memory_limit=2G
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Use config v3 workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        run: >-
          composer config repositories.componenta-config
          '{"type":"path","url":".ci/config","options":{"symlink":false,"versions":{"componenta/config":"3.0.0"}}}'

      - name: Use validation workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        run: >-
          composer config repositories.componenta-validation
          '{"type":"path","url":".ci/validation","options":{"symlink":false,"versions":{"componenta/validation":"3.0.1"}}}'

      - name: Use reflection v2 workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        run: >-
          composer config repositories.componenta-reflection
          '{"type":"path","url":".ci/reflection","options":{"symlink":false,"versions":{"componenta/reflection":"2.0.1"}}}'

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Enforce coverage and generate Clover report
        run: composer test-coverage -- --coverage-clover coverage.xml

      - name: Check mutation score
        run: composer test-mutation -- --parallel

      - name: Upload mutation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-php-8.5
          path: |
            .phpunit.cache/mutation-report.json
            .phpunit.cache/mutation-workers/
          include-hidden-files: true
          # Bootstrap failures may occur before either report is written.
          if-no-files-found: warn

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-php-8.5
          path: coverage.xml
          if-no-files-found: error

  benchmark:
    name: v4.0.10 vs selected ref benchmark
    if: github.event_name == 'workflow_dispatch'
    needs:
      - check
      - windows
      - coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout config v3 workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: componenta/config
          ref: main
          path: .ci/config

      - name: Checkout validation workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: componenta/validation
          ref: main
          path: .ci/validation

      - name: Checkout reflection v2 workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: componenta/reflection
          ref: main
          path: .ci/reflection

      - name: Checkout v4.0.10 baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 5d0e7d7c2e804dd113df5e0f732c2fff882b3bd1
          path: .benchmark/v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Use config v3 workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        run: >-
          composer config repositories.componenta-config
          '{"type":"path","url":".ci/config","options":{"symlink":false,"versions":{"componenta/config":"3.0.0"}}}'

      - name: Use validation workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        run: >-
          composer config repositories.componenta-validation
          '{"type":"path","url":".ci/validation","options":{"symlink":false,"versions":{"componenta/validation":"3.0.1"}}}'

      - name: Use reflection v2 workspace
        if: env.USE_CONFIG_V3_WORKSPACE == 'true'
        run: >-
          composer config repositories.componenta-reflection
          '{"type":"path","url":".ci/reflection","options":{"symlink":false,"versions":{"componenta/reflection":"2.0.1"}}}'

      - name: Install candidate dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install v4.0.10 dependencies
        working-directory: .benchmark/v4
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Compare runtime and explicit factory paths
        shell: bash
        env:
          DI_BENCH_ITERATIONS: '100000'
          DI_BUILD_ITERATIONS: '5000'
        run: |
          candidate_commit="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          candidate_label="$GITHUB_REF_NAME ($candidate_commit)"

          echo '=== v4.0.10 runtime ==='
          COMPONENTA_DI_BENCH_AUTOLOAD="$GITHUB_WORKSPACE/.benchmark/v4/vendor/autoload.php" \
          COMPONENTA_DI_BENCH_SOURCE="$GITHUB_WORKSPACE/.benchmark/v4/src" \
          php benchmarks/RuntimeBench.php | tee /tmp/runtime-v4.txt

          printf '=== %s runtime ===\n' "$candidate_label"
          COMPONENTA_DI_BENCH_AUTOLOAD="$GITHUB_WORKSPACE/vendor/autoload.php" \
          COMPONENTA_DI_BENCH_SOURCE="$GITHUB_WORKSPACE/src" \
          php benchmarks/RuntimeBench.php | tee /tmp/runtime-candidate.txt

          echo '=== v4.0.10 explicit factories vs reflection ==='
          COMPONENTA_DI_BENCH_AUTOLOAD="$GITHUB_WORKSPACE/.benchmark/v4/vendor/autoload.php" \
          COMPONENTA_DI_BENCH_SOURCE="$GITHUB_WORKSPACE/.benchmark/v4/src" \
          php benchmarks/GeneratedVsReflectionBench.php | tee /tmp/generated-v4.txt

          printf '=== %s explicit factories vs reflection ===\n' "$candidate_label"
          COMPONENTA_DI_BENCH_AUTOLOAD="$GITHUB_WORKSPACE/vendor/autoload.php" \
          COMPONENTA_DI_BENCH_SOURCE="$GITHUB_WORKSPACE/src" \
          php benchmarks/GeneratedVsReflectionBench.php | tee /tmp/generated-candidate.txt

          {
            printf '## v4.0.10 vs %s benchmark\n' "$candidate_label"
            echo
            echo '### v4.0.10 runtime'
            echo '```text'
            cat /tmp/runtime-v4.txt
            echo '```'
            echo
            printf '### %s runtime\n' "$candidate_label"
            echo '```text'
            cat /tmp/runtime-candidate.txt
            echo '```'
            echo
            echo '### v4.0.10 explicit factories vs reflection'
            echo '```text'
            cat /tmp/generated-v4.txt
            echo '```'
            echo
            printf '### %s explicit factories vs reflection\n' "$candidate_label"
            echo '```text'
            cat /tmp/generated-candidate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
