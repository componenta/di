name: CI

on:
  push:
    branches:
      - dev
      - main
      - v2
      - v5
  pull_request:

permissions:
  contents: write
  statuses: write

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install exact final v5 candidate
        if: matrix.php == '8.4' && hashFiles('.v5-final-patch/archive-00') != ''
        run: |
          : > /tmp/v5-final-src-tests.tar.gz
          for chunk in .v5-final-patch/archive-*; do
            base64 -d "$chunk" >> /tmp/v5-final-src-tests.tar.gz
          done
          echo '5a67e6df52ea506d4f80343c3b17f8222066b0e517a661f38bad533605a08df4  /tmp/v5-final-src-tests.tar.gz' | sha256sum --check
          rm -rf src tests
          tar -xzf /tmp/v5-final-src-tests.tar.gz
          git rm -r .v5-final-patch
          git add src tests
          git diff --check --cached
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize v5 attribute runtime'
          git push origin HEAD:v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run checks
        id: checks
        continue-on-error: true
        run: composer check

      - name: Collect PHPStan diagnostics
        if: steps.checks.outcome == 'failure'
        run: vendor/bin/phpstan analyse src --level=max --error-format=json > phpstan-${{ matrix.php }}.json || true

      - name: Upload PHPStan diagnostics
        if: steps.checks.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: phpstan-${{ matrix.php }}
          path: phpstan-${{ matrix.php }}.json
          if-no-files-found: ignore

      - name: Fail when checks failed
        if: steps.checks.outcome == 'failure'
        run: exit 1

      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          PHP_VERSION: ${{ matrix.php }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = "success" ]; then state=success; fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"ci/php-$PHP_VERSION\",\"description\":\"PHP $PHP_VERSION composer check: $state\",\"target_url\":\"$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID\"}"
