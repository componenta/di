name: CI

on:
  push:
    branches:
      - dev
      - main
      - v2
      - v5
  pull_request:

permissions:
  contents: write
  statuses: write

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply staged v5 source fix
        if: matrix.php == '8.4' && hashFiles('.v5-static-fix.patch') != ''
        run: |
          git apply --check .v5-static-fix.patch
          git apply .v5-static-fix.patch
          git rm .v5-static-fix.patch
          git add src
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix v5 static contracts'
          git push origin HEAD:v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Upload temporary workspace snapshot
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v6
        with:
          name: v5-workspace-php84
          include-hidden-files: true
          path: |
            src
            tests
            vendor
            composer.json
            phpstan.neon.dist
            phpunit.xml
            .php-cs-fixer.dist.php
          if-no-files-found: error

      - name: Run checks
        id: checks
        continue-on-error: true
        run: composer check

      - name: Collect PHPStan diagnostics
        if: steps.checks.outcome == 'failure'
        run: vendor/bin/phpstan analyse src --level=max --error-format=json > phpstan-${{ matrix.php }}.json || true

      - name: Upload PHPStan diagnostics
        if: steps.checks.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: phpstan-${{ matrix.php }}
          path: phpstan-${{ matrix.php }}.json
          if-no-files-found: ignore

      - name: Fail when checks failed
        if: steps.checks.outcome == 'failure'
        run: exit 1

      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          PHP_VERSION: ${{ matrix.php }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = "success" ]; then state=success; fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"ci/php-$PHP_VERSION\",\"description\":\"PHP $PHP_VERSION composer check: $state\",\"target_url\":\"$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID\"}"
