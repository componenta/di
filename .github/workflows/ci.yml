name: CI

on:
  push:
    branches:
      - v5
  pull_request:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run checks
        run: composer check

      - name: Smoke benchmark harness
        env:
          DI_BENCH_ITERATIONS: '10000'
          DI_BUILD_ITERATIONS: '1000'
        run: |
          export COMPONENTA_DI_BENCH_AUTOLOAD="$GITHUB_WORKSPACE/vendor/autoload.php"
          export COMPONENTA_DI_BENCH_SOURCE="$GITHUB_WORKSPACE/src"
          php benchmarks/RuntimeBench.php >/dev/null
          php benchmarks/GeneratedVsReflectionBench.php >/dev/null
          php benchmarks/BuildPhasesBench.php >/dev/null
          php benchmarks/ParameterPlanBench.php >/dev/null

      - name: Publish check status
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          JOB_STATUS: ${{ job.status }}
          PHP_VERSION: ${{ matrix.php }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" != "success" ] && [ "$state" != "failure" ]; then
            state="error"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"ci/php-$PHP_VERSION\",\"description\":\"composer check on PHP $PHP_VERSION\",\"target_url\":\"$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID\"}"

  windows:
    name: Windows PHP 8.4
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check coding style
        run: composer cs-check

      - name: Run PHPStan
        run: composer phpstan

      - name: Run Pest
        run: composer pest

  coverage:
    name: Coverage PHP 8.4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate Clover coverage
        run: ./vendor/bin/pest --coverage-clover coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-php-8.4
          path: coverage.xml
          if-no-files-found: error

  benchmark:
    name: v4 vs v5 benchmark
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v5
        uses: actions/checkout@v4

      - name: Checkout v4 baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: .benchmark/v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install v5 dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install v4 dependencies
        working-directory: .benchmark/v4
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Compare runtime and generated paths
        env:
          DI_BENCH_ITERATIONS: '100000'
          DI_BUILD_ITERATIONS: '5000'
        run: |
          echo '=== v4 runtime ==='
          COMPONENTA_DI_BENCH_AUTOLOAD="$GITHUB_WORKSPACE/.benchmark/v4/vendor/autoload.php" \
          COMPONENTA_DI_BENCH_SOURCE="$GITHUB_WORKSPACE/.benchmark/v4/src" \
          php benchmarks/RuntimeBench.php | tee /tmp/runtime-v4.txt

          echo '=== v5 runtime ==='
          COMPONENTA_DI_BENCH_AUTOLOAD="$GITHUB_WORKSPACE/vendor/autoload.php" \
          COMPONENTA_DI_BENCH_SOURCE="$GITHUB_WORKSPACE/src" \
          php benchmarks/RuntimeBench.php | tee /tmp/runtime-v5.txt

          echo '=== v4 generated vs reflection ==='
          COMPONENTA_DI_BENCH_AUTOLOAD="$GITHUB_WORKSPACE/.benchmark/v4/vendor/autoload.php" \
          COMPONENTA_DI_BENCH_SOURCE="$GITHUB_WORKSPACE/.benchmark/v4/src" \
          php benchmarks/GeneratedVsReflectionBench.php | tee /tmp/generated-v4.txt

          echo '=== v5 generated vs reflection ==='
          COMPONENTA_DI_BENCH_AUTOLOAD="$GITHUB_WORKSPACE/vendor/autoload.php" \
          COMPONENTA_DI_BENCH_SOURCE="$GITHUB_WORKSPACE/src" \
          php benchmarks/GeneratedVsReflectionBench.php | tee /tmp/generated-v5.txt

          {
            echo '## v4 vs v5 benchmark'
            echo
            echo '### v4 runtime'
            echo '```text'
            cat /tmp/runtime-v4.txt
            echo '```'
            echo
            echo '### v5 runtime'
            echo '```text'
            cat /tmp/runtime-v5.txt
            echo '```'
            echo
            echo '### v4 generated vs reflection'
            echo '```text'
            cat /tmp/generated-v4.txt
            echo '```'
            echo
            echo '### v5 generated vs reflection'
            echo '```text'
            cat /tmp/generated-v5.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
