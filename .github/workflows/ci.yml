name: CI

on:
  push:
    branches:
      - v5
  pull_request:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run checks
        run: composer check

      - name: Smoke benchmark harness
        env:
          DI_BENCH_ITERATIONS: '10000'
          DI_BUILD_ITERATIONS: '1000'
        run: |
          export COMPONENTA_DI_BENCH_AUTOLOAD="$GITHUB_WORKSPACE/vendor/autoload.php"
          export COMPONENTA_DI_BENCH_SOURCE="$GITHUB_WORKSPACE/src"
          php benchmarks/RuntimeBench.php >/dev/null
          php benchmarks/GeneratedVsReflectionBench.php >/dev/null
          php benchmarks/BuildPhasesBench.php >/dev/null

      - name: Publish check status
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          JOB_STATUS: ${{ job.status }}
          PHP_VERSION: ${{ matrix.php }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" != "success" ] && [ "$state" != "failure" ]; then
            state="error"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"ci/php-$PHP_VERSION\",\"description\":\"composer check on PHP $PHP_VERSION\",\"target_url\":\"$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID\"}"
