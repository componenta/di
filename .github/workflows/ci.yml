name: CI

on:
  push:
    branches:
      - dev
      - main
      - v2
      - v5
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run checks
        run: composer check

      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          PHP_VERSION: ${{ matrix.php }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = "success" ]; then state=success; fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"ci/php-$PHP_VERSION\",\"description\":\"PHP $PHP_VERSION composer check: $state\",\"target_url\":\"$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID\"}"
