name: CI

on:
  push:
    branches:
      - v5

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose v5 archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Diagnose archive
        run: |
          sha256sum .v5-final-patch/archive-*
          : > /tmp/v5-final-src-tests.tar.gz
          for chunk in .v5-final-patch/archive-*; do
            base64 -d "$chunk" >> /tmp/v5-final-src-tests.tar.gz
          done
          sha256sum /tmp/v5-final-src-tests.tar.gz
          tar -tzf /tmp/v5-final-src-tests.tar.gz >/dev/null
          exit 1
