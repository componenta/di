name: CI

on:
  push:
    branches:
      - v5

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    name: Diagnose v5 archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Diagnose archive
        run: |
          sha256sum .v5-final-patch/archive-*
          : > /tmp/v5-final-src-tests.tar.gz
          for chunk in .v5-final-patch/archive-*; do
            base64 -d "$chunk" >> /tmp/v5-final-src-tests.tar.gz
          done
          sha256sum /tmp/v5-final-src-tests.tar.gz
          tar -tzf /tmp/v5-final-src-tests.tar.gz >/dev/null
      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "{\"state\":\"success\",\"context\":\"ci/archive-diagnostic\",\"description\":\"v5 archive diagnostic\",\"target_url\":\"$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID\"}"
