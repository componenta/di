name: Full audit seventh-pass probes

on:
  push:
    branches:
      - verify-dev-full-audit-7

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pest tests/FullAudit7ProbeTest.php --colors=always
