name: Patch invokable pipeline validation

on:
  push:
    branches: [verify-dev-recheck]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact ContainerBuilder patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/ContainerBuilder.php')
          source = path.read_text()

          if 'InvokableSpecificationValidator::supportsAttributePipeline(' in source:
              print('ContainerBuilder patch already applied.')
              raise SystemExit(0)

          replacements = [
              (
                  """        $this->fillPipelines(\n            $parametersResolver,\n            $handlerRegistry,\n            $container,\n        );\n        $parametersResolver->seal();\n        $handlerRegistry->seal();\n""",
                  """        $this->fillPipelines(\n            $parametersResolver,\n            $handlerRegistry,\n            $container,\n        );\n\n        foreach ($this->invokables as $class) {\n            InvokableSpecificationValidator::assertValid($class, $attributeProcessor);\n        }\n\n        $parametersResolver->seal();\n        $handlerRegistry->seal();\n""",
              ),
              (
                  """            $constructor = $reflection->getConstructor();\n            $invocations = $attributes->invocations($reflection);\n\n            if (($constructor === null || $constructor->getNumberOfParameters() === 0)\n                && self::supportsInvokableAttributes($invocations)\n            ) {\n""",
                  """            $constructor = $reflection->getConstructor();\n\n            if (($constructor === null || $constructor->getNumberOfParameters() === 0)\n                && InvokableSpecificationValidator::supportsAttributePipeline(\n                    $reflection,\n                    $attributes,\n                )\n            ) {\n""",
              ),
              (
                  """            new InvokableResolver(\n                $this->invokables,\n                $proxyFactory,\n            ),\n""",
                  """            new InvokableResolver(\n                $this->invokables,\n                $proxyFactory,\n                $attributeProcessor,\n            ),\n""",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one matching patch fragment, found {count}.')
              source = source.replace(old, new, 1)

          start_marker = """    /**\n     * InvokableResolver preserves class-level Lazy and Proxy strategies. Any\n     * other attribute invocation still needs the generated attribute pipeline.\n"""
          end_marker = """    private function invalidateBindingValidationFor(string $id, string $kind): void\n"""
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate obsolete supportsInvokableAttributes helper exactly.')
          source = source[:start] + source[end:]

          path.write_text(source)
          PY

          git diff --check
          git diff -- src/ContainerBuilder.php
      - name: Commit source patch
        shell: bash
        run: |
          if git diff --quiet -- src/ContainerBuilder.php; then
            exit 0
          fi
          git config user.name "Andrey Shelamkoff"
          git config user.email "inbox.shelamkoff@gmail.com"
          git add src/ContainerBuilder.php
          git commit -m "Validate invokables against active attribute handlers"
          git push origin HEAD:verify-dev-recheck
